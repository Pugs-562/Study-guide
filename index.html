<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pixel Study Pug Companion - Pro Edition</title>
    <style>
        :root {
            --bg-color: #f7f8fa;
            --nav-bg: #ffffff;
            --active-bg: #e6f0fa;
            --text-main: #333;
            --text-muted: #888;
            --accent: #4A90E2;
            --ac-grid-line: #a0a0a0;
            --ac-grid-bold: #555555;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: #e0e5ec;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            touch-action: manipulation;
        }

        /* Mobile App Container */
        #app {
            width: 100%;
            max-width: 400px;
            height: 100vh;
            max-height: 850px;
            background-color: var(--bg-color);
            position: relative;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
        }

        /* Top Environment (Always Visible) */
        #environment {
            height: 320px;
            flex-shrink: 0;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: background 0.5s ease;
            background: linear-gradient(to bottom, #87CEEB 0%, #87CEEB 60%, #55cc55 60%, #32CD32 100%);
            border-bottom: 3px solid rgba(0,0,0,0.1);
        }

        /* Retro Pixel Grid Overlay */
        .pixel-bg-layer {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background-image: 
                linear-gradient(rgba(0,0,0,0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0,0,0,0.05) 1px, transparent 1px);
            background-size: 10px 10px;
            pointer-events: none;
            z-index: 1;
        }

        /* Unified Pet Animation */
        #pet-wrapper {
            position: relative;
            width: 160px;
            height: 160px;
            animation: floatAndBreathe 3s ease-in-out infinite;
            z-index: 10;
            cursor: pointer;
        }

        @keyframes floatAndBreathe {
            0%, 100% { transform: translateY(0) scale(1); }
            50% { transform: translateY(-8px) scale(1.02, 0.98); }
        }

        /* Pixel Pug Grid */
        #base-pug {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: grid;
            grid-template-columns: repeat(16, 1fr);
            grid-template-rows: repeat(16, 1fr);
            image-rendering: pixelated;
        }

        /* Costume Overlay Grid */
        #costume-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: grid;
            grid-template-columns: repeat(16, 1fr);
            grid-template-rows: repeat(16, 1fr);
            pointer-events: none;
            z-index: 15;
        }
        .pixel { width: 100%; height: 100%; }

        /* Custom Pixel Shop Item Overlays */
        #shop-overlay { position: absolute; width: 100%; height: 100%; top: 0; left: 0; pointer-events: none; z-index: 20; }
        .equip-hat { position: absolute; top: -35px; left: 50%; transform: translateX(-50%); width: 70px; height: 70px; z-index: 21;}
        .equip-drink { position: absolute; bottom: -5px; right: -25px; width: 55px; height: 55px; z-index: 22;}
        .equip-food { position: absolute; bottom: -5px; left: -25px; width: 55px; height: 55px; z-index: 22;}

        /* App Panels */
        .panel {
            flex: 1; background: white; z-index: 20; display: none;
            flex-direction: column; padding: 20px; box-sizing: border-box; overflow-y: auto;
        }
        .panel.active { display: flex; }
        h2 { margin-top: 0; color: var(--text-main); display: flex; justify-content: space-between; align-items: center;}
        
        /* Buttons */
        .btn {
            background: var(--accent); color: white; border: none; padding: 12px; border-radius: 10px;
            font-size: 1rem; font-weight: bold; cursor: pointer; transition: 0.15s; text-align: center;
        }
        .btn:active { transform: scale(0.95); opacity: 0.9; }

        /* Timer */
        #timer-display { font-size: 4.5rem; font-weight: bold; text-align: center; margin: 40px 0; color: var(--text-main); cursor: pointer; font-variant-numeric: tabular-nums; }
        
        .time-picker-hidden {
            display: none; font-size: 3rem; font-weight: bold; text-align: center; margin: 40px auto;
            border: 2px solid var(--accent); border-radius: 12px; padding: 10px;
            color: var(--text-main); background: white; width: 80%; font-family: inherit;
        }

        /* --- Animal Crossing Style Editor Grid (iOS Optimized) --- */
        #editor-grid {
            width: 100%; aspect-ratio: 1; display: grid; 
            touch-action: none; /* CRITICAL FOR IOS DRAWING */
            user-select: none; -webkit-user-select: none;
            grid-template-columns: repeat(16, 1fr); grid-template-rows: repeat(16, 1fr);
            border-top: 2px solid var(--ac-grid-bold); border-left: 2px solid var(--ac-grid-bold);
            background: #ffffff; margin-bottom: 15px; box-shadow: inset 0 0 0 1px #eee;
        }
        
        .edit-cell {
            border-right: 1px solid var(--ac-grid-line); border-bottom: 1px solid var(--ac-grid-line);
            box-sizing: border-box; cursor: crosshair; touch-action: none;
        }

        /* AC Thicker Axis Lines (Intersection at 8x8) */
        .edit-cell.col-8 { border-right: 2px solid var(--ac-grid-bold); }
        .edit-cell.row-8 { border-bottom: 2px solid var(--ac-grid-bold); }
        .edit-cell.col-16 { border-right: 2px solid var(--ac-grid-bold); }
        .edit-cell.row-16 { border-bottom: 2px solid var(--ac-grid-bold); }
        
        #palette { display: grid; grid-template-columns: repeat(8, 1fr); gap: 6px; margin-top: 5px; }
        .color-swatch { width: 100%; aspect-ratio: 1; border-radius: 50%; cursor: pointer; border: 2px solid rgba(0,0,0,0.1); box-sizing: border-box; }
        .color-swatch.selected { border: 3px solid #333; transform: scale(1.15); box-shadow: 0 2px 5px rgba(0,0,0,0.2); }
        .editor-controls { display: flex; gap: 10px; margin-top: 15px; }

        /* Shop & Inventory */
        .grid-container { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; padding-bottom: 20px;}
        .card {
            background: #f8f9fa; border-radius: 12px; padding: 15px; text-align: center;
            border: 2px solid #eee; display: flex; flex-direction: column; justify-content: space-between; align-items: center;
        }
        .icon-container { width: 60px; height: 60px; margin: 10px auto; background: rgba(0,0,0,0.05); border-radius: 8px; display: flex; justify-content: center; align-items: center;}
        .price-tag { font-weight: bold; color: #FFA500; margin: 10px 0; }
        
        .coin-display { font-weight: bold; color: #FFA500; background: #fff8e1; padding: 5px 12px; border-radius: 20px; border: 1px solid #ffe082; font-size: 1.1rem;}

        /* Bottom Navigation */
        nav {
            height: 70px; flex-shrink: 0; background: var(--nav-bg); display: flex; 
            justify-content: space-around; align-items: center; border-top: 1px solid #e0e0e0; z-index: 30; padding-bottom: env(safe-area-inset-bottom);
        }
        .nav-btn {
            background: none; border: none; padding: 10px; border-radius: 16px;
            cursor: pointer; color: var(--text-muted); transition: all 0.2s ease; flex: 1; margin: 0 5px;
            display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 0.7rem; font-weight: bold;
        }
        .nav-btn.active { background: var(--active-bg); color: var(--accent); }
        .nav-btn svg { width: 24px; height: 24px; stroke-width: 2.5; }
    </style>
</head>
<body>

<div id="app">
    <!-- Top Environment: Pug is always visible -->
    <div id="environment">
        <div class="pixel-bg-layer"></div>
        <div id="pet-wrapper" onclick="petPug()">
            <div id="base-pug"></div>
            <div id="costume-overlay"></div>
            <div id="shop-overlay"></div>
        </div>
    </div>

    <!-- Panel 1: Timer -->
    <div id="camera-panel" class="panel active">
        <h2>Study Focus <span class="coin-display">🪙 <span class="shop-coin-display">150</span></span></h2>
        <p style="color: var(--text-muted); margin-top: 0;">Focus to earn coins! (4🪙 per min)</p>
        <div id="timer-display" onclick="openTimePicker()">25:00</div>
        <input type="time" id="native-time-picker" class="time-picker-hidden" value="00:25" onchange="saveNativeTime()" onblur="saveNativeTime()">
        <button class="btn" id="start-timer-btn" onclick="toggleTimer()">Start Session</button>
    </div>

    <!-- Panel 2: Pixel Editor -->
    <div id="sparkles-panel" class="panel">
        <h2 style="margin-bottom: 5px;">Costume Designer</h2>
        <p style="color: var(--text-muted); margin-top: 0; font-size: 0.85rem;">Draw directly on the pattern grid.</p>
        
        <!-- Animal Crossing Style Grid -->
        <div id="editor-grid"></div>
        
        <div class="editor-controls">
            <button class="btn" style="flex:1; background: #e74c3c;" onclick="clearCostume()">Clear</button>
            <button class="btn" style="flex:1; background: #2ecc71;" onclick="eraserMode()">Eraser</button>
        </div>
        <p style="margin: 15px 0 5px 0; font-weight: bold;">Color Palette</p>
        <div id="palette"></div>
    </div>

    <!-- Panel 3: Inventory -->
    <div id="inventory-panel" class="panel">
        <h2>My Items</h2>
        <p style="color: var(--text-muted); margin-top: 0; font-size: 0.85rem;">Equip your purchased items here.</p>
        <div id="inventory-container" class="grid-container"></div>
    </div>

    <!-- Panel 4: Shop -->
    <div id="shop-panel" class="panel">
        <h2>Item Shop <span class="coin-display">🪙 <span class="shop-coin-display">150</span></span></h2>
        <p style="color: var(--text-muted); margin-top: 0; font-size: 0.85rem;">Spend focus coins on pixel accessories.</p>
        <div id="shop-container" class="grid-container"></div>
    </div>

    <!-- Navigation Menu -->
    <nav>
        <button class="nav-btn active" data-target="camera" onclick="switchTab('camera', this)">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
            Focus
        </button>
        <button class="nav-btn" data-target="sparkles" onclick="switchTab('sparkles', this)">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M12 19l7-7 3 3-7 7-3-3z"/><path d="M18 13l-1.5-7.5L2 2l3.5 14.5L13 18l5-5z"/><path d="M2 2l7.586 7.586"/><circle cx="11" cy="11" r="2"/></svg>
            Design
        </button>
        <button class="nav-btn" data-target="inventory" onclick="switchTab('inventory', this)">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M20 7H4a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2z"/><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/></svg>
            Bag
        </button>
        <button class="nav-btn" data-target="shop" onclick="switchTab('shop', this)">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>
            Shop
        </button>
    </nav>
</div>

<script>
    // --- Global State ---
    const GRID_SIZE = 16;
    let selectedColor = 'transparent';
    let isDrawing = false;
    let coins = 150; 
    let initialDuration = 25 * 60; 
    let timeLeft = 25 * 60;
    let timerInterval = null;
    let isStudying = false;

    // Update Coin UI across all panels
    function updateCoinDisplays() {
        document.querySelectorAll('.shop-coin-display').forEach(el => el.innerText = coins);
    }

    // --- Tab Navigation ---
    function switchTab(target, btnElement) {
        document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('active'));
        document.querySelectorAll('.panel').forEach(panel => panel.classList.remove('active'));
        btnElement.classList.add('active');
        document.getElementById(target + '-panel').classList.add('active');
        
        if(target === 'shop') renderShop();
        if(target === 'inventory') renderInventory();
    }

    // --- NEW REFINED PUG SPRITE (16x16) ---
    // Much cuter shading, clear ears, prominent nose and tongue
    const pugDesign = [
        "0000000000000000",
        "0004400000044000",
        "0044440000444400",
        "0444443333444440",
        "0444411111144440",
        "0044111111114400",
        "0031111111111300",
        "0031133333311300",
        "0031345334531300",
        "0031344334431300",
        "0031133443311300",
        "0003113333113000",
        "0003111363113000",
        "0003111111113000",
        "0000333003330000",
        "0000000000000000"
    ];
    
    // Color Palette for Pug
    const pugColors = { 
        '0': 'transparent', 
        '1': '#EAB875', /* Base Fawn */ 
        '2': '#D1A362', /* Shade (unused in base, available for costume) */ 
        '3': '#3E2A1E', /* Dark Brown Outline/Mask */ 
        '4': '#221915', /* Ear Black */ 
        '5': '#FFFFFF', /* Eye Shine */ 
        '6': '#FF8BA0'  /* Tongue */ 
    };

    const basePug = document.getElementById('base-pug');
    pugDesign.forEach(row => {
        for(let char of row) {
            const cell = document.createElement('div');
            cell.style.backgroundColor = pugColors[char];
            basePug.appendChild(cell);
        }
    });

    function petPug() {
        const pug = document.getElementById('pet-wrapper');
        pug.style.transform = 'scale(1.1) translateY(-15px)';
        setTimeout(() => { pug.style.transform = ''; }, 200);
    }

    // --- Dynamic Backgrounds ---
    const bgThemes = [
        "linear-gradient(to bottom, #87CEEB 0%, #87CEEB 60%, #55cc55 60%, #32CD32 100%)", // Day
        "linear-gradient(to bottom, #FF7E5F 0%, #FEB47B 50%, #d45d79 50%, #6A0572 100%)", // Sunset
        "linear-gradient(to bottom, #0F2027 0%, #203A43 55%, #1b2e35 55%, #111 100%)"    // Night
    ];
    let bgIndex = 0;
    function cycleBackground() {
        bgIndex = (bgIndex + 1) % bgThemes.length;
        document.getElementById('environment').style.background = bgThemes[bgIndex];
    }

    // --- Animal Crossing Style Editor Grid (iOS Fixed) ---
    const editorGrid = document.getElementById('editor-grid');
    const overlayGrid = document.getElementById('costume-overlay');
    const palette = document.getElementById('palette');

    for (let i = 0; i < GRID_SIZE * GRID_SIZE; i++) {
        const editCell = document.createElement('div');
        editCell.classList.add('edit-cell');
        editCell.dataset.index = i;
        
        // Add AC axis markers
        const row = Math.floor(i / GRID_SIZE) + 1;
        const col = (i % GRID_SIZE) + 1;
        if (col === 8) editCell.classList.add('col-8');
        if (row === 8) editCell.classList.add('row-8');
        if (col === 16) editCell.classList.add('col-16');
        if (row === 16) editCell.classList.add('row-16');
        
        const overlayCell = document.createElement('div');
        overlayCell.classList.add('pixel');
        
        editorGrid.appendChild(editCell);
        overlayGrid.appendChild(overlayCell);
    }

    function paint(index) {
        editorGrid.children[index].style.backgroundColor = selectedColor;
        overlayGrid.children[index].style.backgroundColor = selectedColor;
    }

    // Secure Touch Events for iOS Drawing
    editorGrid.addEventListener('touchstart', (e) => {
        e.preventDefault(); // STOPS IOS SCROLLING
        isDrawing = true;
        handleTouch(e);
    }, { passive: false });

    editorGrid.addEventListener('touchmove', (e) => {
        e.preventDefault(); // STOPS IOS SCROLLING
        if(isDrawing) handleTouch(e);
    }, { passive: false });

    editorGrid.addEventListener('touchend', () => isDrawing = false);

    // Mouse fallback for Desktop
    editorGrid.addEventListener('mousedown', (e) => { isDrawing = true; handleMouse(e); });
    editorGrid.addEventListener('mousemove', (e) => { if(isDrawing) handleMouse(e); });
    document.addEventListener('mouseup', () => isDrawing = false);

    function handleTouch(e) {
        const touch = e.touches[0];
        const target = document.elementFromPoint(touch.clientX, touch.clientY);
        if (target && target.classList.contains('edit-cell')) {
            paint(target.dataset.index);
        }
    }
    
    function handleMouse(e) {
        if (e.target && e.target.classList.contains('edit-cell')) {
            paint(e.target.dataset.index);
        }
    }

    // Palette Generation
    for (let i = 0; i < 24; i++) {
        const swatch = document.createElement('div');
        swatch.classList.add('color-swatch');
        
        let colorVal;
        if (i < 4) {
            const shade = Math.floor((i / 3) * 255);
            colorVal = `rgb(${shade}, ${shade}, ${shade})`;
        } else {
            const hue = ((i - 4) / 19) * 360; 
            colorVal = `hsl(${hue}, 90%, 55%)`;
        }
        
        swatch.style.backgroundColor = colorVal;
        swatch.addEventListener('click', (e) => {
            document.querySelectorAll('.color-swatch').forEach(s => s.classList.remove('selected'));
            e.target.classList.add('selected');
            selectedColor = colorVal;
        });
        palette.appendChild(swatch);
    }
    palette.children[0].classList.add('selected');
    selectedColor = palette.children[0].style.backgroundColor;

    function eraserMode() {
        document.querySelectorAll('.color-swatch').forEach(s => s.classList.remove('selected'));
        selectedColor = 'transparent';
    }

    function clearCostume() {
        for (let i = 0; i < editorGrid.children.length; i++) {
            editorGrid.children[i].style.backgroundColor = 'transparent';
            overlayGrid.children[i].style.backgroundColor = 'transparent';
        }
    }

    // --- Study Timer System ---
    function openTimePicker() {
        if (isStudying) return;
        document.getElementById('timer-display').style.display = 'none';
        const picker = document.getElementById('native-time-picker');
        picker.style.display = 'block';
        picker.focus();
        try { picker.showPicker(); } catch(e) {}
    }

    function saveNativeTime() {
        const val = document.getElementById('native-time-picker').value;
        if (!val) return;
        const [hours, mins] = val.split(':').map(Number);
        initialDuration = (hours * 3600) + (mins * 60);
        if (initialDuration === 0) initialDuration = 60; 
        timeLeft = initialDuration;
        document.getElementById('native-time-picker').style.display = 'none';
        document.getElementById('timer-display').style.display = 'block';
        updateTimerDisplay();
    }

    function updateTimerDisplay() {
        const mins = Math.floor(timeLeft / 60).toString().padStart(2, '0');
        const secs = (timeLeft % 60).toString().padStart(2, '0');
        document.getElementById('timer-display').innerText = `${mins}:${secs}`;
    }

    function toggleTimer() {
        const btn = document.getElementById('start-timer-btn');
        if (isStudying) {
            clearInterval(timerInterval);
            btn.innerText = "Resume Session";
            btn.style.background = "var(--accent)";
            isStudying = false;
        } else {
            btn.innerText = "Pause Session";
            btn.style.background = "#e67e22";
            isStudying = true;
            document.getElementById('native-time-picker').style.display = 'none';
            document.getElementById('timer-display').style.display = 'block';

            timerInterval = setInterval(() => {
                if (timeLeft > 0) {
                    timeLeft--;
                    updateTimerDisplay();
                } else {
                    clearInterval(timerInterval);
                    isStudying = false;
                    btn.innerText = "Start New Session";
                    btn.style.background = "var(--accent)";
                    
                    const earnedCoins = Math.round((initialDuration / 60) * 4);
                    timeLeft = initialDuration;
                    updateTimerDisplay();
                    coins += earnedCoins;
                    updateCoinDisplays();
                    cycleBackground();
                    alert(`Focus complete! You earned ${earnedCoins} coins!`);
                }
            }, 1000);
        }
    }

    // --- Shop & Inventory System (Pixel Art Custom Icons) ---
    const pixelItems = {
        tophat: {
            colors: {0:'transparent', 1:'#222', 2:'#e74c3c'},
            data: ["0000000000","0001111000","0001111000","0001111000","0002222000","0011111100","0000000000","0000000000","0000000000","0000000000"]
        },
        crown: {
            colors: {0:'transparent', 1:'#f1c40f', 2:'#e67e22', 3:'#e74c3c', 4:'#3498db'},
            data: ["0000000000","0010010010","0010111010","0011111110","0013141310","0011111110","0022222220","0000000000","0000000000","0000000000"]
        },
        boba: {
            colors: {0:'transparent', 1:'#ecf0f1', 2:'#d35400', 3:'#e67e22', 4:'#bdc3c7', 5:'#2c3e50'},
            data: ["0000220000","0000200000","0000200000","0014444100","0013333100","0013333100","0015353100","0013535100","0001111000","0000000000"]
        },
        coffee: {
            colors: {0:'transparent', 1:'#fff', 2:'#8e44ad', 3:'#34495e', 4:'#bdc3c7'},
            data: ["0000404000","0004000000","0000040000","0003333000","0011111100","0012222100","0012222100","0001111000","0000000000","0000000000"]
        },
        pizza: {
            colors: {0:'transparent', 1:'#f39c12', 2:'#f1c40f', 3:'#c0392b'},
            data: ["0000000000","0011111100","0012322100","0002223000","0003222000","0000230000","0000220000","0000000000","0000000000","0000000000"]
        },
        bone: {
            colors: {0:'transparent', 1:'#ecf0f1', 2:'#bdc3c7'},
            data: ["0000000000","0011001100","0111111110","0111111110","0011001100","0000000000","0000000000","0000000000","0000000000","0000000000"]
        }
    };

    const catalog = [
        { id: 'tophat', name: "Top Hat", price: 50, type: "hat", equipClass: "equip-hat" },
        { id: 'crown', name: "Crown", price: 150, type: "hat", equipClass: "equip-hat" },
        { id: 'boba', name: "Boba Tea", price: 80, type: "drink", equipClass: "equip-drink" },
        { id: 'coffee', name: "Coffee", price: 40, type: "drink", equipClass: "equip-drink" },
        { id: 'pizza', name: "Pizza", price: 60, type: "food", equipClass: "equip-food" },
        { id: 'bone', name: "Treat Bone", price: 30, type: "food", equipClass: "equip-food" }
    ];

    let ownedItems = [];
    let equippedItems = { hat: null, drink: null, food: null };

    // Function to generate pure HTML/CSS pixel grids for items
    function buildPixelGrid(itemId, size = '100%') {
        const item = pixelItems[itemId];
        const wrapper = document.createElement('div');
        wrapper.style.display = 'grid';
        wrapper.style.gridTemplateColumns = 'repeat(10, 1fr)';
        wrapper.style.width = size;
        wrapper.style.height = size;
        wrapper.style.imageRendering = 'pixelated';
        
        item.data.forEach(row => {
            for(let char of row) {
                const cell = document.createElement('div');
                cell.style.backgroundColor = item.colors[char];
                wrapper.appendChild(cell);
            }
        });
        return wrapper;
    }

    // Render the Shop (Items you DO NOT own)
    function renderShop() {
        const container = document.getElementById('shop-container');
        container.innerHTML = '';
        
        const unowned = catalog.filter(item => !ownedItems.includes(item.id));
        
        if(unowned.length === 0) {
            container.innerHTML = `<p style="grid-column: span 2; text-align:center; color: var(--text-muted);">Shop is empty! You bought everything.</p>`;
            return;
        }

        unowned.forEach(item => {
            const card = document.createElement('div');
            card.classList.add('card');
            
            const iconContainer = document.createElement('div');
            iconContainer.className = 'icon-container';
            iconContainer.appendChild(buildPixelGrid(item.id, '40px'));

            card.appendChild(iconContainer);
            card.insertAdjacentHTML('beforeend', `
                <div style="font-weight: bold; font-size: 0.9rem;">${item.name}</div>
                <div class="price-tag">🪙 ${item.price}</div>
                <button class="btn" style="width: 100%; font-size: 0.85rem;" onclick="buyItem('${item.id}')">Buy</button>
            `);
            container.appendChild(card);
        });
    }

    // Render the Inventory (Items you DO own)
    function renderInventory() {
        const container = document.getElementById('inventory-container');
        container.innerHTML = '';
        
        const owned = catalog.filter(item => ownedItems.includes(item.id));
        
        if(owned.length === 0) {
            container.innerHTML = `<p style="grid-column: span 2; text-align:center; color: var(--text-muted);">Your bag is empty. Buy items in the shop!</p>`;
            return;
        }

        owned.forEach(item => {
            const card = document.createElement('div');
            card.classList.add('card');
            
            const isEquipped = equippedItems[item.type] === item.id;
            
            let btnHtml = isEquipped 
                ? `<button class="btn" style="width: 100%; background: #95a5a6; font-size: 0.85rem;" onclick="unequipItem('${item.type}')">Unequip</button>`
                : `<button class="btn" style="width: 100%; background: #2ecc71; font-size: 0.85rem;" onclick="equipItem('${item.id}')">Equip</button>`;

            const iconContainer = document.createElement('div');
            iconContainer.className = 'icon-container';
            iconContainer.appendChild(buildPixelGrid(item.id, '40px'));

            card.appendChild(iconContainer);
            card.insertAdjacentHTML('beforeend', `
                <div style="font-weight: bold; font-size: 0.9rem; margin-bottom: 10px;">${item.name}</div>
                ${btnHtml}
            `);
            container.appendChild(card);
        });
    }

    function buyItem(id) {
        const item = catalog.find(i => i.id === id);
        if (coins >= item.price) {
            coins -= item.price;
            ownedItems.push(id);
            updateCoinDisplays();
            renderShop();
            alert(`Purchased ${item.name}! It is now in your Bag.`);
        } else { 
            alert("Not enough coins! Keep studying!"); 
        }
    }

    function equipItem(id) {
        const item = catalog.find(i => i.id === id);
        equippedItems[item.type] = item.id;
        renderInventory();
        renderPugOverlays();
    }

    function unequipItem(type) {
        equippedItems[type] = null;
        renderInventory();
        renderPugOverlays();
    }

    function renderPugOverlays() {
        const overlay = document.getElementById('shop-overlay');
        overlay.innerHTML = ''; 
        Object.values(equippedItems).forEach(itemId => {
            if (itemId) {
                const item = catalog.find(i => i.id === itemId);
                const el = document.createElement('div');
                el.className = item.equipClass;
                // Full size grid for the pet view
                el.appendChild(buildPixelGrid(itemId, '100%'));
                overlay.appendChild(el);
            }
        });
    }

    // Init
    updateCoinDisplays();
</script>
</body>
</html>

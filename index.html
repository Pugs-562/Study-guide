<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pixel Study Pug Companion</title>
    <style>
        :root {
            --bg-color: #f7f8fa;
            --nav-bg: #ffffff;
            --active-bg: #f0f2f5;
            --text-main: #333;
            --text-muted: #888;
            --accent: #4A90E2;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: #e0e5ec;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            touch-action: manipulation;
        }

        /* Mobile App Container */
        #app {
            width: 100%;
            max-width: 400px;
            height: 100vh;
            max-height: 850px;
            background-color: var(--bg-color);
            position: relative;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }

        /* Top Environment (Always Visible) */
        #environment {
            height: 320px;
            flex-shrink: 0;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: background 0.5s ease;
            background: linear-gradient(to bottom, #87CEEB 0%, #87CEEB 60%, #55cc55 60%, #32CD32 100%);
        }

        /* Retro Pixel Grid Overlay */
        .pixel-bg-layer {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background-image: 
                linear-gradient(rgba(0,0,0,0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0,0,0,0.05) 1px, transparent 1px);
            background-size: 8px 8px;
            pointer-events: none;
            z-index: 1;
        }

        /* Unified Pet Animation */
        #pet-wrapper {
            position: relative;
            width: 160px;
            height: 160px;
            animation: floatAndBreathe 3s ease-in-out infinite;
            z-index: 10;
            cursor: pointer;
        }

        @keyframes floatAndBreathe {
            0%, 100% { transform: translateY(0) scale(1); }
            50% { transform: translateY(-12px) scale(1.02, 0.98); }
        }

        /* Pixel Pug Grid */
        #base-pug {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: grid;
            grid-template-columns: repeat(16, 1fr);
            grid-template-rows: repeat(16, 1fr);
            image-rendering: pixelated;
        }

        /* Costume Overlay Grid */
        #costume-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: grid;
            grid-template-columns: repeat(16, 1fr);
            grid-template-rows: repeat(16, 1fr);
            pointer-events: none;
            z-index: 15;
        }
        .pixel { width: 100%; height: 100%; }

        /* Custom Pixel Shop Item Overlays */
        #shop-overlay { position: absolute; width: 100%; height: 100%; top: 0; left: 0; pointer-events: none; z-index: 20; }
        .equip-hat { position: absolute; top: -35px; left: 50%; transform: translateX(-50%); width: 70px; height: 70px; }
        .equip-drink { position: absolute; bottom: -5px; right: -25px; width: 55px; height: 55px; }
        .equip-food { position: absolute; bottom: -5px; left: -25px; width: 55px; height: 55px; }

        /* App Panels */
        .panel {
            flex: 1; background: white; z-index: 20; display: none;
            flex-direction: column; padding: 20px; box-sizing: border-box; overflow-y: auto;
        }
        .panel.active { display: flex; }
        h2 { margin-top: 0; color: var(--text-main); }
        
        /* Buttons */
        .btn {
            background: var(--accent); color: white; border: none; padding: 15px; border-radius: 12px;
            font-size: 1rem; font-weight: bold; cursor: pointer; transition: 0.2s; text-align: center;
        }
        .btn:active { transform: scale(0.95); }

        /* Timer */
        #timer-display { font-size: 4rem; font-weight: bold; text-align: center; margin: 40px 0; color: var(--text-main); cursor: pointer; }
        
        .time-picker-hidden {
            display: none; font-size: 3rem; font-weight: bold; text-align: center; margin: 40px auto;
            border: 2px solid var(--accent); border-radius: 12px; padding: 10px;
            color: var(--text-main); background: white; width: 80%; font-family: inherit;
        }

        /* Animal Crossing Style Editor Grid */
        #editor-grid {
            width: 100%; aspect-ratio: 1; display: grid; 
            touch-action: none; /* Crucial for iOS */
            user-select: none; -webkit-user-select: none;
            grid-template-columns: repeat(16, 1fr); grid-template-rows: repeat(16, 1fr);
            border-top: 1px solid #ccc; border-left: 1px solid #ccc;
            background: #fafafa; margin-bottom: 15px;
        }
        
        .edit-cell {
            border-right: 1px solid #e0e0e0; border-bottom: 1px solid #e0e0e0;
            box-sizing: border-box; cursor: crosshair; touch-action: none;
        }

        /* Axis Lines for the AC Style Look */
        .edit-cell.col-8 { border-right: 2px solid #888; }
        .edit-cell.row-8 { border-bottom: 2px solid #888; }
        
        #palette { display: grid; grid-template-columns: repeat(8, 1fr); gap: 5px; margin-top: 5px; }
        .color-swatch { width: 100%; aspect-ratio: 1; border-radius: 4px; cursor: pointer; border: 1px solid rgba(0,0,0,0.1); }
        .color-swatch.selected { border: 3px solid #333; transform: scale(1.1); }
        .editor-controls { display: flex; gap: 10px; margin-top: 15px; }

        /* Shop */
        #shop-container { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; padding-bottom: 20px;}
        .shop-card {
            background: #f8f9fa; border-radius: 12px; padding: 15px; text-align: center;
            border: 2px solid #eee; display: flex; flex-direction: column; justify-content: space-between; align-items: center;
        }
        .shop-icon-container { width: 60px; height: 60px; margin: 10px auto; }
        .shop-price { font-weight: bold; color: #FFA500; margin: 10px 0; }

        /* Bottom Navigation */
        nav {
            height: 80px; flex-shrink: 0; background: var(--nav-bg); display: flex; 
            justify-content: space-around; align-items: center; border-top: 1px solid #eee; z-index: 30;
        }
        .nav-btn {
            background: none; border: none; padding: 10px; border-radius: 20px;
            cursor: pointer; color: var(--text-muted); transition: all 0.2s ease; flex: 1; margin: 0 5px;
        }
        .nav-btn.active { background: var(--active-bg); color: var(--text-main); }
        .nav-btn svg { width: 24px; height: 24px; stroke-width: 2; }
    </style>
</head>
<body>

<div id="app">
    <!-- Top Environment: Pug is always visible -->
    <div id="environment">
        <div class="pixel-bg-layer"></div>
        <div id="pet-wrapper" onclick="petPug()">
            <div id="base-pug"></div>
            <div id="costume-overlay"></div>
            <div id="shop-overlay"></div>
        </div>
    </div>

    <!-- Timer Panel -->
    <div id="camera-panel" class="panel active">
        <h2>Study Focus</h2>
        <p style="color: var(--text-muted)">Earn 100 coins per 25 minutes! Click timer to set duration.</p>
        <div id="timer-display" onclick="openTimePicker()">25:00</div>
        <input type="time" id="native-time-picker" class="time-picker-hidden" value="00:25" onchange="saveNativeTime()" onblur="saveNativeTime()">
        <button class="btn" id="start-timer-btn" onclick="toggleTimer()">Start Session</button>
    </div>

    <!-- Pixel Editor Panel -->
    <div id="sparkles-panel" class="panel">
        <h2>Costume Editor</h2>
        <p style="color: var(--text-muted); margin-top: 0; font-size: 0.9rem;">Draw directly on the grid!</p>
        
        <!-- AC Style Grid -->
        <div id="editor-grid"></div>
        
        <div class="editor-controls">
            <button class="btn" style="flex:1; background: #e74c3c;" onclick="clearCostume()">Clear</button>
            <button class="btn" style="flex:1; background: #2ecc71;" onclick="eraserMode()">Eraser</button>
        </div>
        <p style="margin: 15px 0 5px 0; font-weight: bold;">Palette</p>
        <div id="palette"></div>
    </div>

    <!-- Shop Panel -->
    <div id="shop-panel" class="panel">
        <div style="display:flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
            <h2 style="margin:0;">Item Shop</h2>
            <div style="font-weight: bold; color: #FFA500;">🪙 <span id="shop-coin-display">150</span></div>
        </div>
        <div id="shop-container"></div>
    </div>

    <!-- Navigation Menu -->
    <nav>
        <button class="nav-btn active" data-target="camera" onclick="switchTab('camera', this)">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="3" y="7" width="18" height="13" rx="2"/><circle cx="12" cy="13" r="3"/></svg>
        </button>
        <button class="nav-btn" data-target="sparkles" onclick="switchTab('sparkles', this)">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M12 2l2.4 7.6 7.6 2.4-7.6 2.4-2.4 7.6-2.4-7.6-7.6-2.4 7.6-2.4z"/></svg>
        </button>
        <button class="nav-btn" data-target="shop" onclick="switchTab('shop', this)">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="9" cy="21" r="1"></circle><circle cx="20" cy="21" r="1"></circle><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path></svg>
        </button>
    </nav>
</div>

<script>
    // --- Global State ---
    const GRID_SIZE = 16;
    let selectedColor = 'transparent';
    let isDrawing = false;
    let coins = 150; 
    let initialDuration = 25 * 60; 
    let timeLeft = 25 * 60;
    let timerInterval = null;
    let isStudying = false;

    // --- Tab Navigation ---
    function switchTab(target, btnElement) {
        document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('active'));
        document.querySelectorAll('.panel').forEach(panel => panel.classList.remove('active'));
        btnElement.classList.add('active');
        document.getElementById(target + '-panel').classList.add('active');
    }

    // --- Highly Refined Pixel Art Pug (16x16 with shading) ---
    const pugDesign = [
        "0003300000033000",
        "0033300000033300",
        "0333222222223330",
        "0332111111112330",
        "0321111111111230",
        "0211111111111120",
        "0211333333331120",
        "0213333333333120",
        "0213453333453120", // Eyes with white shine
        "0213443333443120",
        "0213333443333120", // Nose
        "0021333333331200",
        "0002113663112000", // Pink Tongue
        "0002111111112000",
        "0002100000012000",
        "0003300000033000"
    ];
    
    // Color Palette for Pug
    const pugColors = { 
        '0': 'transparent', '1': '#E4B573', /* Base Fawn */ '2': '#D1A362', /* Shade */ 
        '3': '#2C1E16', /* Dark Mask */ '4': '#000000', /* Black */ 
        '5': '#FFFFFF', /* Eye Shine */ '6': '#FF8BA0'  /* Tongue */ 
    };

    const basePug = document.getElementById('base-pug');
    pugDesign.forEach(row => {
        for(let char of row) {
            const cell = document.createElement('div');
            cell.style.backgroundColor = pugColors[char];
            basePug.appendChild(cell);
        }
    });

    function petPug() {
        const pug = document.getElementById('pet-wrapper');
        pug.style.transform = 'scale(1.1) translateY(-20px)';
        setTimeout(() => { pug.style.transform = ''; }, 200);
    }

    // --- Dynamic Backgrounds ---
    const bgThemes = [
        "linear-gradient(to bottom, #87CEEB 0%, #87CEEB 60%, #55cc55 60%, #32CD32 100%)", // Day
        "linear-gradient(to bottom, #FF7E5F 0%, #FEB47B 50%, #d45d79 50%, #6A0572 100%)", // Sunset
        "linear-gradient(to bottom, #0F2027 0%, #203A43 55%, #1b2e35 55%, #111 100%)"    // Night
    ];
    let bgIndex = 0;
    function cycleBackground() {
        bgIndex = (bgIndex + 1) % bgThemes.length;
        document.getElementById('environment').style.background = bgThemes[bgIndex];
    }

    // --- Animal Crossing Style Editor (iOS Fixes Applied) ---
    const editorGrid = document.getElementById('editor-grid');
    const overlayGrid = document.getElementById('costume-overlay');
    const palette = document.getElementById('palette');

    for (let i = 0; i < GRID_SIZE * GRID_SIZE; i++) {
        const editCell = document.createElement('div');
        editCell.classList.add('edit-cell');
        editCell.dataset.index = i;
        
        // Add AC axis lines
        const row = Math.floor(i / GRID_SIZE) + 1;
        const col = (i % GRID_SIZE) + 1;
        if (col === 8) editCell.classList.add('col-8');
        if (row === 8) editCell.classList.add('row-8');
        
        const overlayCell = document.createElement('div');
        overlayCell.classList.add('pixel');
        
        editorGrid.appendChild(editCell);
        overlayGrid.appendChild(overlayCell);
    }

    function paint(index) {
        editorGrid.children[index].style.backgroundColor = selectedColor;
        overlayGrid.children[index].style.backgroundColor = selectedColor;
    }

    // Mouse Events for Desktop
    editorGrid.addEventListener('mousedown', (e) => { 
        isDrawing = true; 
        if(e.target.classList.contains('edit-cell')) paint(e.target.dataset.index); 
    });
    editorGrid.addEventListener('mouseover', (e) => { 
        if(isDrawing && e.target.classList.contains('edit-cell')) paint(e.target.dataset.index); 
    });
    document.addEventListener('mouseup', () => isDrawing = false);

    // Secure Touch Events for iOS Drawing
    editorGrid.addEventListener('touchstart', (e) => {
        e.preventDefault(); 
        isDrawing = true;
        handleTouch(e);
    }, { passive: false });

    editorGrid.addEventListener('touchmove', (e) => {
        e.preventDefault();
        if(isDrawing) handleTouch(e);
    }, { passive: false });

    editorGrid.addEventListener('touchend', () => isDrawing = false);

    function handleTouch(e) {
        const touch = e.touches[0];
        const target = document.elementFromPoint(touch.clientX, touch.clientY);
        if (target && target.classList.contains('edit-cell')) {
            paint(target.dataset.index);
        }
    }

    // Palette Generation
    for (let i = 0; i < 32; i++) {
        const swatch = document.createElement('div');
        swatch.classList.add('color-swatch');
        
        let colorVal;
        if (i < 4) {
            const shade = Math.floor((i / 3) * 255);
            colorVal = `rgb(${shade}, ${shade}, ${shade})`;
        } else {
            const hue = ((i - 4) / 27) * 360; 
            colorVal = `hsl(${hue}, 90%, 55%)`;
        }
        
        swatch.style.backgroundColor = colorVal;
        swatch.addEventListener('click', (e) => {
            document.querySelectorAll('.color-swatch').forEach(s => s.classList.remove('selected'));
            e.target.classList.add('selected');
            selectedColor = colorVal;
        });
        palette.appendChild(swatch);
    }
    palette.children[0].classList.add('selected');
    selectedColor = palette.children[0].style.backgroundColor;

    function eraserMode() {
        document.querySelectorAll('.color-swatch').forEach(s => s.classList.remove('selected'));
        selectedColor = 'transparent';
    }

    function clearCostume() {
        for (let i = 0; i < editorGrid.children.length; i++) {
            editorGrid.children[i].style.backgroundColor = 'transparent';
            overlayGrid.children[i].style.backgroundColor = 'transparent';
        }
    }

    // --- Study Timer & Picker Logic ---
    function openTimePicker() {
        if (isStudying) return;
        document.getElementById('timer-display').style.display = 'none';
        const picker = document.getElementById('native-time-picker');
        picker.style.display = 'block';
        picker.focus();
        try { picker.showPicker(); } catch(e) {}
    }

    function saveNativeTime() {
        const val = document.getElementById('native-time-picker').value;
        if (!val) return;
        const [hours, mins] = val.split(':').map(Number);
        initialDuration = (hours * 3600) + (mins * 60);
        if (initialDuration === 0) initialDuration = 60; 
        timeLeft = initialDuration;
        document.getElementById('native-time-picker').style.display = 'none';
        document.getElementById('timer-display').style.display = 'block';
        updateTimerDisplay();
    }

    function updateTimerDisplay() {
        const mins = Math.floor(timeLeft / 60).toString().padStart(2, '0');
        const secs = (timeLeft % 60).toString().padStart(2, '0');
        document.getElementById('timer-display').innerText = `${mins}:${secs}`;
    }

    function toggleTimer() {
        const btn = document.getElementById('start-timer-btn');
        if (isStudying) {
            clearInterval(timerInterval);
            btn.innerText = "Resume Session";
            btn.style.background = "var(--accent)";
            isStudying = false;
        } else {
            btn.innerText = "Pause Session";
            btn.style.background = "#e67e22";
            isStudying = true;
            document.getElementById('native-time-picker').style.display = 'none';
            document.getElementById('timer-display').style.display = 'block';

            timerInterval = setInterval(() => {
                if (timeLeft > 0) {
                    timeLeft--;
                    updateTimerDisplay();
                } else {
                    clearInterval(timerInterval);
                    isStudying = false;
                    btn.innerText = "Start New Session";
                    btn.style.background = "var(--accent)";
                    
                    const earnedCoins = Math.round((initialDuration / 60) * 4);
                    timeLeft = initialDuration;
                    updateTimerDisplay();
                    coins += earnedCoins;
                    document.getElementById('shop-coin-display').innerText = coins;
                    cycleBackground();
                    alert(`Focus complete! Rate: 100🪙 per 25m. You earned ${earnedCoins} coins!`);
                }
            }, 1000);
        }
    }

    // --- Custom Pixel Art Shop System ---
    const pixelItems = {
        tophat: {
            colors: {0:'transparent', 1:'#222', 2:'#e74c3c'},
            data: ["0000000000","0001111000","0001111000","0001111000","0002222000","0011111100","0000000000","0000000000","0000000000","0000000000"]
        },
        crown: {
            colors: {0:'transparent', 1:'#f1c40f', 2:'#e67e22', 3:'#e74c3c', 4:'#9b59b6'},
            data: ["0000000000","0010010010","0010111010","0011111110","0013141310","0011111110","0022222220","0000000000","0000000000","0000000000"]
        },
        boba: {
            colors: {0:'transparent', 1:'#ecf0f1', 2:'#d35400', 3:'#2c3e50', 4:'#bdc3c7', 5:'#e74c3c'},
            data: ["0000550000","0000500000","0000500000","0014444100","0012222100","0012222100","0013232100","0012323100","0001111000","0000000000"]
        },
        coffee: {
            colors: {0:'transparent', 1:'#fff', 2:'#8e44ad', 3:'#34495e', 4:'#95a5a6'},
            data: ["0000404000","0004000000","0000040000","0003333000","0011111100","0012222100","0012222100","0001111000","0000000000","0000000000"]
        },
        pizza: {
            colors: {0:'transparent', 1:'#f39c12', 2:'#f1c40f', 3:'#c0392b'},
            data: ["0000000000","0011111100","0012322100","0002223000","0003222000","0000230000","0000220000","0000000000","0000000000","0000000000"]
        },
        bone: {
            colors: {0:'transparent', 1:'#ecf0f1', 2:'#bdc3c7'},
            data: ["0000000000","0011001100","0111111110","0111111110","0011001100","0000000000","0000000000","0000000000","0000000000","0000000000"]
        }
    };

    const shopCatalog = [
        { id: 'tophat', name: "Top Hat", price: 50, type: "hat", equipClass: "equip-hat" },
        { id: 'crown', name: "Crown", price: 150, type: "hat", equipClass: "equip-hat" },
        { id: 'boba', name: "Boba Tea", price: 40, type: "drink", equipClass: "equip-drink" },
        { id: 'coffee', name: "Coffee", price: 25, type: "drink", equipClass: "equip-drink" },
        { id: 'pizza', name: "Pizza", price: 30, type: "food", equipClass: "equip-food" },
        { id: 'bone', name: "Treat Bone", price: 60, type: "food", equipClass: "equip-food" }
    ];

    let ownedItems = [];
    let equippedItems = { hat: null, drink: null, food: null };

    // Builder function for the 10x10 custom items
    function buildPixelGrid(itemId, size = '100%') {
        const item = pixelItems[itemId];
        const wrapper = document.createElement('div');
        wrapper.style.display = 'grid';
        wrapper.style.gridTemplateColumns = 'repeat(10, 1fr)';
        wrapper.style.width = size;
        wrapper.style.height = size;
        wrapper.style.imageRendering = 'pixelated';
        
        item.data.forEach(row => {
            for(let char of row) {
                const cell = document.createElement('div');
                cell.style.backgroundColor = item.colors[char];
                wrapper.appendChild(cell);
            }
        });
        return wrapper;
    }

    function renderShop() {
        const container = document.getElementById('shop-container');
        container.innerHTML = '';
        
        shopCatalog.forEach(item => {
            const card = document.createElement('div');
            card.classList.add('shop-card');
            
            const isOwned = ownedItems.includes(item.id);
            const isEquipped = equippedItems[item.type] === item.id;
            
            let btnHtml = '';
            if (!isOwned) {
                btnHtml = `<button class="btn" style="padding: 10px; width: 100%;" onclick="buyItem('${item.id}')">Buy</button>`;
            } else if (!isEquipped) {
                btnHtml = `<button class="btn" style="padding: 10px; width: 100%; background: #2ecc71;" onclick="equipItem('${item.id}')">Equip</button>`;
            } else {
                btnHtml = `<button class="btn" style="padding: 10px; width: 100%; background: #95a5a6;" onclick="unequipItem('${item.type}')">Unequip</button>`;
            }

            const iconContainer = document.createElement('div');
            iconContainer.className = 'shop-icon-container';
            iconContainer.appendChild(buildPixelGrid(item.id));

            card.appendChild(iconContainer);
            card.insertAdjacentHTML('beforeend', `
                <div style="font-weight: bold;">${item.name}</div>
                <div class="shop-price">${isOwned ? 'Purchased' : '🪙 ' + item.price}</div>
                ${btnHtml}
            `);
            container.appendChild(card);
        });
    }

    function buyItem(id) {
        const item = shopCatalog.find(i => i.id === id);
        if (coins >= item.price) {
            coins -= item.price;
            ownedItems.push(id);
            document.getElementById('shop-coin-display').innerText = coins;
            equipItem(id); 
            renderShop();
        } else { alert("Not enough coins! Keep studying!"); }
    }

    function equipItem(id) {
        const item = shopCatalog.find(i => i.id === id);
        equippedItems[item.type] = item.id;
        renderShop();
        renderPugOverlays();
    }

    function unequipItem(type) {
        equippedItems[type] = null;
        renderShop();
        renderPugOverlays();
    }

    function renderPugOverlays() {
        const overlay = document.getElementById('shop-overlay');
        overlay.innerHTML = ''; 
        Object.values(equippedItems).forEach(itemId => {
            if (itemId) {
                const item = shopCatalog.find(i => i.id === itemId);
                const el = document.createElement('div');
                el.className = item.equipClass;
                el.appendChild(buildPixelGrid(itemId));
                overlay.appendChild(el);
            }
        });
    }

    renderShop();
</script>
</body>
</html>
